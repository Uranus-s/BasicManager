server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /
  tomcat:
    max-connections: 8192
    threads:
      # 使用虚拟线程
      use-virtual-threads: true

spring:
  application:
    name: BasicManage
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  threads:
    virtual:
      enabled: true

# MyBatis-Plus 配置
mybatis-plus:
  mapper-locations: classpath*:/mapper/*.xml
  global-config:
    db-config:
      # 逻辑删除字段名
      logic-delete-field: deleted
      # 逻辑删除值
      logic-delete-value: 1
      # 逻辑未删除值
      logic-not-delete-value: 0
      # 主键类型
      id-type: auto
  # 分页插件配置
  pagehelper:
    helper-dialect: mysql
    reasonable: true
    support-methods-arguments: true

# 系统配置
system:
  init-key: ${SYSTEM_INIT_KEY:admin-init-key}

basic:
  ai:
    agent:
      # 单次运行限制工具调用总数，防止模型持续调用工具形成循环。
      max-tool-calls: 16
      # 限制完整 AI 模型流的执行时间，纯聊天和工具调用共用。
      timeout: 90s
      # 写操作预览超过该时间后必须重新生成，不能继续确认旧快照。
      approval-ttl: 15m
  file:
    storage-type: local
    local:
      base-path: ${BASIC_FILE_LOCAL_BASE_PATH:uploads}
      url-prefix: ${BASIC_FILE_LOCAL_URL_PREFIX:/uploads}
  thread-pool:
    shutdown:
      await-termination: 30s
    cpu:
      # core-pool-size 与 maximum-pool-size 未配置时根据运行时 CPU 核数计算。
      queue-capacity: 500
      keep-alive: 60s
    virtual:
      concurrency-limit: 200
      total-concurrency-limit: 1000
      # 按下游资源或关键业务配置少量隔离池；未使用时保持为空。
      businesses: {}
    scheduled:
      pool-size: 2
